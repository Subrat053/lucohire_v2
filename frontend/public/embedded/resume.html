function b64ToUtf8(b64str){
  const binary = atob(b64str);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

/* ---- shared state, read/written by each embedded step through window.parent ---- */
window.LucoState = { paths: [] };

const FRAME_IDS = { resume:'frame-resume', padhaao:'frame-padhaao', practice:'frame-practice', test:'frame-test', batado:'frame-batado' };
const loaded = {};
const note = document.getElementById('loadingNote');

function ensureLoaded(key){
  if(loaded[key]) return;
  note.classList.add('show');
  const frame = document.getElementById(FRAME_IDS[key]);
  frame.srcdoc = b64ToUtf8(PAGES[key]);
  loaded[key] = true;
  frame.addEventListener('load', ()=>note.classList.remove('show'), {once:true});
}

window.LucoNav = function(key){
  if(!FRAME_IDS[key]) return;
  ensureLoaded(key);
  Object.values(FRAME_IDS).forEach(id=>document.getElementById(id).classList.remove('active'));
  document.getElementById(FRAME_IDS[key]).classList.add('active');
  window.scrollTo(0,0);
};

/* start on Step 1 */
window.LucoNav('resume');
